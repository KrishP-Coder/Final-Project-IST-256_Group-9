<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="shopping-cart">

    <h1>Shopping Cart</h1>
    <p>Reserve seats for ClubU events.</p>

    <div class="row g-4">
        <div class="col-lg-7">
            <h2>Search Events</h2>
            <input type="text" id="searchBar" class="form-control mb-3" placeholder="Search events...">

            <h2>Available Events</h2>
            <div class="table-responsive">
                <table class="table table-dark table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>Event ID</th>
                            <th>Event Name</th>
                            <th>Category</th>
                            <th>Seats Available</th>
                            <th>Price</th>
                            <th>Reserve</th>
                        </tr>
                    </thead>
                    <tbody id="eventList"></tbody>
                </table>
            </div>
        </div>

        <div class="col-lg-5">
            <h2>Your Cart</h2>
            <div id="cartContainer" class="table-responsive">
                <table id="cartTable" class="table table-dark table-bordered">
                    <thead>
                        <tr>
                            <th>Event Name</th>
                            <th>Price</th>
                            <th>Seats</th>
                            <th>Remove</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems"></tbody>
                </table>
            </div>

            <h2>Total: $<span id="totalAmount">0.00</span></h2>

            <h2>Reservation Details</h2>
            <form id="checkoutForm" novalidate>
                <div class="mb-3">
                    <label for="attendeeName">Name:</label>
                    <input type="text" id="attendeeName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="attendeeEmail">Email:</label>
                    <input type="email" id="attendeeEmail" class="form-control" required>
                </div>
                <button type="submit" id="checkoutButton">Checkout</button>
            </form>

            <div class="mt-3">
                <button type="button" id="downloadReservationsButton">Download Reservations JSON</button>
                <p id="reservationCount">Saved reservations: 0</p>
            </div>

            <div id="message" class="d-none" role="alert"></div>
        </div>
    </div>

    <br><br>
    <p>
        Navigation:
        <a href="index.html"><button type="button">Home</button></a>
        <a href="product.html"><button type="button">Events</button></a>
        <a href="signup.html"><button type="button">Sign Up</button></a>
    </p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="cart.js"></script>
</body>
</html>
