
<!DOCTYPE html>
<html lang="en">

<head>
    <title>ClubU Event Approval</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="approval-page">

 <h1>ClubU Event Approval</h1>

 <h2>Search Submissions</h2>
 <label for="searchBar" class="visually-hidden">Search submissions</label>
 <input type="text" id="searchBar" class="form-control mb-3"
 placeholder="Search submitted events">

<h2>Submitted Events</h2>

 <div class="table-responsive">
 <table class="table table-dark table-striped table-bordered">
<thead>
<tr>
    <th>Event ID</th>
    <th>Event Name</th>
    <th>Category</th>
    <th>Submitted By</th>
    <th>Additional Info</th>
    <th>Status</th>
    <th>Update</th>
    </tr>
    </thead>

    <tbody id="submissionTable"></tbody>
    </table>
    </div>

    <h2>Review Event Submission</h2>

    <form id="approvalForm" novalidate>

    <div class="mb-3">
    <label for="itemId">Event ID:</label>
    <input type="text" id="itemId" class="form-control"
    placeholder="Enter event ID" required>
        </div>

        <div class="mb-3">
            <label for="status">Approval Status:</label>
            <select id="status" class="form-select" required>
                <option value="">Choose a status</option>
                <option value="Approved">Approve</option>
                <option value="Rejected">Reject</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="reviewComments">Review Comments:</label>
            <input type="text" id="reviewComments" class="form-control"
                placeholder="Enter optional comments">
        </div>

        <button type="submit" id="approveButton">Submit Review</button>
        <button type="button" id="cancelButton">Clear Form</button>

    </form>

    <div id="message" class="d-none" role="alert"></div>

    <br><br>

    <p>
        Navigation:
        <a href="index.html" class="btn btn-primary">Home</a>
        <a href="product.html" class="btn btn-primary">Events</a>
        <a href="signup.html" class="btn btn-primary">Sign Up</a>
        <a href="shoppingCart.html" class="btn btn-primary">Shopping Cart</a>
        <a href="finalization.html" class="btn btn-primary">Finalization</a>
    </p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="approval.js"></script>

</body>
</html>
