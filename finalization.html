
<!DOCTYPE html>
<html lang="en">

<head>
    <title>ClubU Finalization</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="shopping-cart">

    <h1>ClubU Reservation Finalization</h1>
    <p>Review your reservations and select your attendance and payment options.</p>
    <h2>Your Reservations</h2>

    <div class="table-responsive">
        <table class="table table-dark table-striped table-bordered">
            <thead>
                <tr>
                    <th>Event Name</th>
                    <th>Seats</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody id="reservationTable"></tbody>
        </table>
    </div>
    <p>Total: $<span id="totalAmount">0.00</span></p>

    <h2>Finalization Options</h2>

    <form id="finalizationForm">
        <div class="mb-3">
            <label for="attendanceType">Attendance Type:</label>
            <select id="attendanceType" class="form-select" required>
                <option value="">Choose attendance type</option>
                <option value="Virtual">Virtual</option>
                <option value="In Person">In Person</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="paymentType">Payment Type:</label>
            
            <select id="paymentType" class="form-select" required>
                <option value="">Choose payment type</option>
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
            </select>
        </div>

        <button type="submit">Confirm Reservation</button>
    </form>

    <br><br>
    <p>
        Return to homepage:
        <a href="index.html"><button type="button">Home</button></a>
        <a href="shoppingCart.html"><button type="button">Shopping Cart</button></a>
    </p>

</body>
</html>
