<!-- HTML for Signup Page -->
<!DOCTYPE html>
<html>
<head>
    <title>Sign Up to the Clud!</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<!-- Signup Form -WillTaylor -->

<body>

    <h1>Sign Up Here</h1>

    <form id="signupForm">

        <label>Name:</label>
        <input type="text" id="name" required>
        <br>

        <label>Age:</label>
        <input type="number" id="age" required>
        <br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br>

        <label>Address:</label>
        <input type="text" id="address" required>
        <br>

        <label>Phone:</label>
        <input type="text" id="phone">

        <button type="submit">Submit</button>

    </form>

    <!-- Members Table -WillTaylor -->

    <h2>Members</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Update</th>
                </tr>
            </thead>

            <tbody id="memberTable"></tbody>
        </table>

        <br>

        <button id="downloadButton">Download JSON</button>

    <script src="script.js"></script>
    <br><br>
    
    <!-- Home button -WillTaylor -->
    <p>
        Return to homepage:
        <a href="index.html"><button type="submit">Home</button></a>
    </p>
    
</body>
</html>
