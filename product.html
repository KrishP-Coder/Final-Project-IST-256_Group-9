<!DOCTYPE html>
<html lang="en">

<head>
    <title>ClubU Event Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="product-page">

    <h1>ClubU Event Management</h1>

    <h2>Search Events</h2>
    <input type="text" id="searchBar" class="form-control mb-3" placeholder="Search events...">

    <h2>Club Events</h2>

    <div class="table-responsive">
        <table class="table table-dark table-striped table-bordered">
            <thead>
                <tr>
                    <th>Event ID</th>
                    <th>Event Name</th>
                    <th>Category</th>
                    <th>Format</th>
                    <th>Cost</th>
                    <th>Additional Info</th>
                    <th>Update</th>
                </tr>
            </thead>

            <tbody id="eventTable"></tbody>
        </table>
    </div>

    <button type="button" id="downloadButton">Download JSON</button>

    <h2>Add or Update an Event</h2>

    <form id="eventForm" novalidate>

        <div class="mb-3">
            <label for="itemId">Event ID:</label>
            <input type="text" id="itemId" class="form-control" placeholder="Example: event-10" required>
        </div>

        <div class="mb-3">
            <label for="description">Event Name:</label>
            <input type="text" id="description" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="category">Event Category:</label>
            <select id="category" class="form-select" required>
                <option value="">Choose a category</option>
                <option value="Workshop">Workshop</option>
                <option value="Competition">Competition</option>
                <option value="Networking">Networking</option>
                <option value="Seminar">Seminar</option>
                <option value="Trip">Trip</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="unit">Event Format:</label>
            <select id="unit" class="form-select" required>
                <option value="">Choose a format</option>
                <option value="Hours">Hours</option>
                <option value="Sessions">Sessions</option>
                <option value="Days">Days</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="price">Event Cost ($):</label>
            <input type="number" id="price" class="form-control" min="0" step="0.01" required>
        </div>

        <div class="mb-3">
            <label for="info">Additional Information (Optional):</label>
            <input type="text" id="info" class="form-control">
        </div>

        <button type="submit" id="saveButton">Add Event</button>
        <button type="button" id="cancelButton">Clear Form</button>

    </form>

    <div id="message" class="d-none" role="alert"></div>

    <br><br>

    <p>
        Return to homepage:
        <a href="index.html"><button type="button">Home</button></a>
    </p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="product.js"></script>

</body>
</html>
