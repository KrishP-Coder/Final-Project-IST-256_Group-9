<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <title>Billing Details</title>
</head>
<body class="billing-page">
    <h1>Billing Details</h1>

    <!-- input fields for:
        User’s full name
        Address
        Credit card number, expiration date, and security code
        Order summary (items in cart, total amount, shipping details)
    -->

   <form>
    <label for="fullName">Full Name:</label><br>
    <input type="text" id="fullName" name="fullName" required><br><br>

    <label for="address">Address:</label><br>
    <input type="text" id="address" name="address" required><br><br>

    <label for="creditCardNumber">Credit Card Number:</label><br>
    <input type="text" id="creditCardNumber" name="creditCardNumber" required><br><br>

    <label for="expirationDate">Expiration Date:</label><br>
    <input type="text" id="expirationDate" name="expirationDate" required><br><br>

    <label for="securityCode">Security Code:</label><br>
    <input type="text" id="securityCode" name="securityCode" required><br><br>

    <label for="orderSummary">Order Summary:</label><br>
    <textarea id="orderSummary" name="orderSummary" required></textarea><br><br>

    <button type="submit">Submit</button>
</form>

</body>
</html>
